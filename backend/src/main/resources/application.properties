
spring.application.name=fit-connect

server.port=${PORT:8081}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fit_connect}
spring.datasource.username=${FITCONNECT_DB_USERNAME}
spring.datasource.password=${FITCONNECT_DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.connection-timeout=10000

# JWT
fitconnect.jwt.secret=${FITCONNECT_JWT_SECRET}
fitconnect.jwt.expiration-ms=86400000

# Initial Admin Setup
fitconnect.admin.name=${FITCONNECT_ADMIN_NAME}
fitconnect.admin.email=${FITCONNECT_ADMIN_EMAIL}
fitconnect.admin.password=${FITCONNECT_ADMIN_PASSWORD}

# Email / SMTP
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
fitconnect.mail.from=${MAIL_FROM}

# Public frontend URL for staff invitation links
fitconnect.invitation.base-url=${FITCONNECT_INVITATION_BASE_URL:http://localhost:3000/#/staff-invitation}
